  <meta name="twitter:title" content="ระบบกำกับติดตามแผนงาน/โครงการ (PPMS)">
  <meta name="twitter:description" content="วิทยาลัยพยาบาลบรมราชชนนี สวรรค์ประชารักษ์ นครสวรรค์">
  <meta name="twitter:image" content="https://lh5.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://lh5.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop">
  <link rel="apple-touch-icon" href="https://lh5.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop">

  <!-- Google Font: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Preloader Layer โทนส้มสถาบัน */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #ffffff 0%, #fff7ed 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-container {
      position: relative;
      margin-bottom: 22px;
    }
    .logo-img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.35);
      background: #ffffff;
      padding: 6px;
      position: relative;
      z-index: 2;
    }
    .logo-halo {
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.3) 0%, rgba(249, 115, 22, 0) 70%);
      animation: pulse-halo 2.5s infinite ease-in-out;
      z-index: 1;
    }
    @keyframes pulse-halo {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.22); opacity: 0.25; }
    }
    .badge-code {
      display: inline-block;
      padding: 3px 14px;
      border-radius: 999px;
      background: #ffedd5;
      color: #c2410c;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      border: 1px solid #fed7aa;
    }
    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #9a3412;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
      text-align: center;
    }
    .brand-subtitle {
      font-size: 0.94rem;
      color: #475569;
      margin-bottom: 24px;
      font-weight: 400;
      text-align: center;
      line-height: 1.4;
    }
    .spinner-ring {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3.5px solid #ffedd5;
      border-radius: 50%;
      border-top-color: #ea580c;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 0.90rem;
      color: #ea580c;
      font-weight: 600;
    }

    /* Fullscreen iFrame Masking (ไม่เปลี่ยน URL) */
    #ppmsFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 1;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Premium Preloader โทนส้มสถาบัน -->
  <div id="preloader">
    <div class="logo-container">
      <div class="logo-halo"></div>
      <img src="https://lh5.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop" alt="BCNSPRNW Logo" class="logo-img">
    </div>
    <div>
      <span class="badge-code">PPMS &bull; OFFICIAL PORTAL</span>
    </div>
    <div class="brand-title">ระบบกำกับติดตามแผนงาน/โครงการ (PPMS)</div>
    <div class="brand-subtitle">วิทยาลัยพยาบาลบรมราชชนนี สวรรค์ประชารักษ์ นครสวรรค์<br>คณะพยาบาลศาสตร์ สถาบันพระบรมราชชนก</div>
    <div class="spinner-ring"></div>
    <div class="status-text">กำลังเชื่อมต่อระบบ กรุณารอสักครู่...</div>
    <div style="margin-top: 20px; font-size: 0.74rem; color: #94a3b8; letter-spacing: 0.3px;">
      v2.18.1 &bull; Build 2026.11.03
    </div>
  </div>

  <!-- Google Apps Script Web App Fullscreen Frame -->
  <iframe 
    id="ppmsFrame" 
    src="https://script.google.com/macros/s/AKfycbxr5r8cSARk39-8JplTrjC_eqKHoBHgdVOc7EIUOOi1R2cqAH3835J8PqUD43zUISmyFA/exec"
    allow="camera; microphone; geolocation; fullscreen; clipboard-read; clipboard-write"
    onload="hidePreloader()">
  </iframe>

  <script>
    function hidePreloader() {
      var loader = document.getElementById('preloader');
      if (loader && !loader.classList.contains('loaded')) {
        setTimeout(function() {
          loader.classList.add('loaded');
        }, 400);
      }
    }

    // Safety timeout: ซ่อน preloader ภายใน 3.5 วินาทีหาก event onload เกิดความล่าช้า
    setTimeout(function() {
      hidePreloader();
    }, 3500);
  </script>

</body>
</html>
